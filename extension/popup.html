<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tag &amp; Consent Auditor</title>
<link rel="stylesheet" href="popup.css">
<script src="theme.js"></script>
</head>
<body>
  <header>
    <div class="site"><span class="label">Measurement audit</span><b id="host">—</b></div>
    <div class="actions">
      <button id="theme" class="icon" aria-label="Switch light or dark mode" title="Light / dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="rescan" class="icon" aria-label="Reload the page and audit again" title="Re-scan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="copy" class="primary">Copy report</button>
    </div>
  </header>

  <section class="summary">
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="val" id="ringval"/></svg><div class="num"><b id="score">–</b><span>score</span></div></div>
    <div class="sumtext">
      <b id="verdict">Checking this page…</b>
      <div class="counts">
        <span><i class="dot fail"></i><b id="cFail">0</b> critical</span>
        <span><i class="dot warn"></i><b id="cWarn">0</b> warnings</span>
        <span><i class="dot pass"></i><b id="cPass">0</b> passed</span>
        <span><b id="cTags">0</b> tags</span>
      </div>
    </div>
  </section>

  <nav>
    <button data-tab="issues" class="on">Issues</button>
    <button data-tab="tags">Tags</button>
    <button data-tab="consent">Consent</button>
    <button data-tab="timeline">Timeline</button>
  </nav>

  <main>
    <div class="panel on" id="issues"></div>
    <div class="panel" id="tags"></div>
    <div class="panel" id="consent"></div>
    <div class="panel" id="timeline"></div>
  </main>

  <script src="analyze.js"></script>
  <script src="popup.js"></script>
</body>
</html>
